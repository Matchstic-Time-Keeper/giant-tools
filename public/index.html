<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex, nofollow">
<title>GiANT Tools</title>
<link rel="stylesheet" href="/shared/tools.css">
<style>
  :root {
    --ink: #111;
    --muted: #6b7280;
    --track: linear-gradient(90deg, #a2373a 0%, #c8732f 25%, #e8b53c 50%, #8fa53a 75%, #3a8b3a 100%);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #fff;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  main { max-width: 720px; margin: 0 auto; padding: 48px 16px; }
  h1 { font-size: clamp(28px, 6vw, 40px); margin: 0 0 8px; }
  .lede { color: var(--muted); margin: 0 0 32px; font-size: 16px; line-height: 1.5; }
  .bar { height: 8px; border-radius: 4px; background: var(--track); margin-bottom: 32px; max-width: 220px; }
  ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
  footer { margin-top: 40px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>GiANT Tools</h1>
  <p class="lede">Interactive versions of GiANT leadership tools for workshops and personal reflection.</p>
  <div class="bar" aria-hidden="true"></div>

  <ul data-tool-list></ul>

  <footer>Photos and answers stay on your device. Nothing is uploaded.</footer>
</main>
<script src="/shared/tools.js"></script>
</body>
</html>
