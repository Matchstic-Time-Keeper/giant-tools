<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex, nofollow">
<title>Leadership Mirror</title>
<style>
  :root {
    --ink: #111;
    --muted: #6b7280;
    --bg: #fff;
    --frame: #a9a9a9;
    --track: linear-gradient(90deg, #a2373a 0%, #c8732f 25%, #e8b53c 50%, #8fa53a 75%, #3a8b3a 100%);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 24px 16px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h1 {
    font-size: clamp(22px, 5.2vw, 36px);
    font-weight: 700;
    text-align: center;
    line-height: 1.15;
    margin: 8px 0 28px;
    text-wrap: balance;
  }

  /* ---------- Mirror ---------- */
  .mirror {
    position: relative;
    width: min(52vw, 240px);
    aspect-ratio: 172 / 246;
    border-radius: 22px;
    border: 2px solid var(--frame);
    overflow: hidden;
    isolation: isolate;
    background: linear-gradient(45deg, #ffffff 0%, #eef6fd 45%, #d9ecfb 100%);
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    cursor: pointer;
  }
  .mirror:focus-visible { outline: 3px solid #2f6fdf; outline-offset: 3px; }
  .mirror.has-photo { cursor: grab; }
  .mirror.dragging { cursor: grabbing; }

  .photo {
    position: absolute;
    left: 50%;
    top: 50%;
    max-width: none;
    transform-origin: center;
    pointer-events: none;
    will-change: transform;
    display: none;
  }
  .has-photo .photo { display: block; }

  .mirror { transition: box-shadow .2s ease; }

  /* ---------- Influence meter ---------- */
  .stage {
    display: grid;
    grid-template-columns: 1fr auto 1fr;   /* keeps the mirror centered */
    column-gap: 18px;
    width: 100%;
  }
  .stage .mirror { grid-column: 2; }
  .meter {
    grid-column: 3;
    justify-self: start;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .meter-arrow { width: 12px; height: 8px; fill: #3a8b3a; }
  .meter-track {
    position: relative;
    flex: 1;
    width: 18px;
    border-radius: 9px;
    background: #e8eaee;
    box-shadow: inset 0 1px 3px rgba(0,0,0,.15);
  }
  /* The full gradient is always there; the clip reveals it from the bottom up */
  .meter-fill {
    --level: .5;
    position: absolute;
    inset: 0;
    border-radius: 9px;
    background: linear-gradient(0deg, #a2373a 0%, #c8732f 25%, #e8b53c 50%, #8fa53a 75%, #3a8b3a 100%);
    clip-path: inset(calc((1 - var(--level)) * 100%) 0 0 0 round 9px);
    transition: clip-path .25s ease;
  }
  .meter-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: #374151;
  }
  .photo { transition: filter .2s ease; }

  /* Fog: condensation on the glass; heavy at low scores, gone by mid-green */
  .fog, .shine {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0;
    transition: opacity .2s ease;
  }
  .fog {
    background:
      radial-gradient(ellipse at 50% 45%, rgba(255,255,255,.55), rgba(255,255,255,.8) 75%),
      linear-gradient(45deg, rgba(240,246,252,.6), rgba(214,232,248,.7));
  }
  /* Shine: a clean highlight once the glass is fully clear. Sits in the lower
     third so it streaks across the shoulders, not the face. */
  .shine { background: linear-gradient(155deg, transparent 64%, rgba(255,255,255,.6) 76%, transparent 88%); }

  /* Glass sits over everything so it still reads as a mirror */
  .glass {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(45deg, rgba(255,255,255,.1) 0%, rgba(225,240,253,.18) 45%, rgba(190,224,250,.42) 100%);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.5), inset 0 0 24px rgba(160,200,235,.35);
    opacity: 0;
  }
  .has-photo .glass { opacity: 1; }

  .glare {
    position: absolute;
    top: 6%;
    right: 5%;
    width: 30%;
    pointer-events: none;
  }

  .empty-hint {
    position: absolute;
    inset: 0;
    display: grid;
    place-content: center;
    justify-items: center;
    gap: 8px;
    padding: 16px;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.3;
    pointer-events: none;
  }
  .empty-hint svg { width: 32px; height: 32px; opacity: .7; }
  .has-photo .empty-hint { display: none; }

  .photo-tools {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 6px 14px;
    margin-top: 14px;
    min-height: 32px;
    font-size: 13px;
    color: var(--muted);
  }
  .photo-tools[hidden] { display: none; }

  button.link {
    font: inherit;
    font-weight: 600;
    color: #2f5fb3;
    background: none;
    border: 0;
    padding: 6px 4px;
    cursor: pointer;
  }
  button.link:hover { text-decoration: underline; }

  /* ---------- Sliders ---------- */
  .scales {
    width: 100%;
    max-width: 880px;
    margin-top: 40px;
    display: grid;
    grid-template-columns: max-content minmax(0, 1fr) max-content;
    align-items: center;
    column-gap: 22px;
    row-gap: 22px;
  }
  .scale { display: contents; }
  .scale .lo, .scale .hi { font-weight: 700; font-size: 22px; }
  .scale .lo { text-align: right; }

  input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 44px;
    margin: 0;
    background: transparent;
    cursor: pointer;
  }
  input[type=range]:focus-visible { outline: 3px solid #2f6fdf; outline-offset: 2px; border-radius: 12px; }
  input[type=range]::-webkit-slider-runnable-track {
    height: 18px;
    border-radius: 9px;
    background: var(--track);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 36px;
    height: 36px;
    margin-top: -9px;
    border-radius: 50%;
    background: #ececec;
    border: 1px solid #b9b9b9;
    box-shadow: 0 5px 10px rgba(0,0,0,.18);
  }
  input[type=range]::-moz-range-track {
    height: 18px;
    border-radius: 9px;
    background: var(--track);
  }
  input[type=range]::-moz-range-thumb {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: #ececec;
    border: 1px solid #b9b9b9;
    box-shadow: 0 5px 10px rgba(0,0,0,.18);
  }

  .actions { margin-top: 22px; }
  .privacy { margin-top: 28px; font-size: 12px; color: var(--muted); text-align: center; }

  /* Phone: labels sit above each bar */
  @media (max-width: 620px) {
    .scales {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 14px;
      margin-top: 32px;
    }
    .scale {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-areas: "lo hi" "bar bar";
    }
    .scale .lo { grid-area: lo; }
    .scale .hi { grid-area: hi; }
    .scale .lo, .scale .hi { font-size: 17px; }
    .scale .lo { text-align: left; }
    .scale .hi { text-align: right; }
    .scale input { grid-area: bar; }
  }
</style>
</head>
<body>
<main>
  <h1>What is it like to be on the other side of me?</h1>

  <div class="stage">
  <div class="mirror" id="mirror" role="button" tabindex="0" aria-label="Add your photo">
    <img class="photo" id="photo" alt="Your portrait">
    <div class="shine" id="shine"></div>
    <div class="fog" id="fog"></div>
    <div class="glass"></div>
    <svg class="glare" viewBox="0 0 60 60" aria-hidden="true">
      <g stroke="rgba(110,130,150,.55)" stroke-width="1.4" stroke-linecap="round" fill="none">
        <line x1="4" y1="2" x2="40" y2="38"/>
        <line x1="22" y1="2" x2="40" y2="20"/>
        <line x1="2" y1="22" x2="30" y2="50"/>
      </g>
    </svg>
    <div class="empty-hint">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>
      </svg>
      <span>Tap to add<br>your photo</span>
    </div>
  </div>

  <div class="meter" id="meter" role="meter" aria-label="Influence" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50">
    <svg class="meter-arrow" viewBox="0 0 12 8" aria-hidden="true"><path d="M6 0 12 8H0z"/></svg>
    <div class="meter-track"><div class="meter-fill" id="meterFill"></div></div>
    <span class="meter-label">Influence</span>
  </div>
  </div>

  <div class="photo-tools" id="photoTools" hidden>
    <span>Drag to position · pinch or scroll to zoom</span>
    <button class="link" type="button" id="changePhoto">Change photo</button>
  </div>

  <input type="file" id="file" accept="image/*" hidden>

  <section class="scales" aria-label="Self-assessment">
    <div class="scale">
      <span class="lo" id="lo1">Reactive</span>
      <input type="range" min="0" max="100" value="50" data-lo="Reactive" data-hi="Proactive" aria-label="Reactive to Proactive">
      <span class="hi">Proactive</span>
    </div>
    <div class="scale">
      <span class="lo">Accidental</span>
      <input type="range" min="0" max="100" value="50" data-lo="Accidental" data-hi="Intentional" aria-label="Accidental to Intentional">
      <span class="hi">Intentional</span>
    </div>
    <div class="scale">
      <span class="lo">Inconsistent</span>
      <input type="range" min="0" max="100" value="50" data-lo="Inconsistent" data-hi="Consistent" aria-label="Inconsistent to Consistent">
      <span class="hi">Consistent</span>
    </div>
  </section>

  <div class="actions">
    <button class="link" type="button" id="reset">Reset sliders</button>
  </div>

  <p class="privacy">Your photo stays on this device. Nothing is uploaded or saved.</p>
</main>

<script>
(() => {
  // ---------- Color: sample the slider gradient and blend in OKLab ----------
  const STOPS = [[0, '#a2373a'], [0.25, '#c8732f'], [0.5, '#e8b53c'], [0.75, '#8fa53a'], [1, '#3a8b3a']];
  const CHROMA_BOOST = 1.3; // glow is a touch more saturated than the bar so it reads on white
  const CLEAR_AT = 0.75;    // average score where the fog is fully gone (mid-green on the bar)
  const MAX_BLUR = 6;       // px of blur on screen at the very lowest scores
  const LINGER_BLUR = .50;  // px of blur that stays past mid-green until every slider is far right
  const MAX_FOG = 0.85;     // opacity of the fog layer at the very lowest scores
  const FOG_CURVE = 1;    // >1 clears quickly at first, then tapers toward mid-green

  const hexToRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255);
  const toLin = c => c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4;
  const fromLin = c => c <= 0.0031308 ? 12.92 * c : 1.055 * c ** (1 / 2.4) - 0.055;

  function rgbToOklab([r, g, b]) {
    r = toLin(r); g = toLin(g); b = toLin(b);
    const l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b);
    const m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b);
    const s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
    return [
      0.2104542553 * l + 0.7936177850 * m - 0.0040720468 * s,
      1.9779984951 * l - 2.4285922050 * m + 0.4505937099 * s,
      0.0259040371 * l + 0.7827717662 * m - 0.8086757660 * s,
    ];
  }
  function oklabToRgb([L, a, b]) {
    const l = (L + 0.3963377774 * a + 0.2158037573 * b) ** 3;
    const m = (L - 0.1055613458 * a - 0.0638541728 * b) ** 3;
    const s = (L - 0.0894841775 * a - 1.2914855480 * b) ** 3;
    return [
      4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
      -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
      -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s,
    ].map(c => Math.round(Math.min(1, Math.max(0, fromLin(c))) * 255));
  }

  const LAB_STOPS = STOPS.map(([t, hex]) => [t, rgbToOklab(hexToRgb(hex))]);

  function colorAt(t) {
    for (let i = 1; i < LAB_STOPS.length; i++) {
      const [t1, c1] = LAB_STOPS[i];
      if (t <= t1) {
        const [t0, c0] = LAB_STOPS[i - 1];
        const k = (t - t0) / (t1 - t0);
        return c0.map((v, j) => v + (c1[j] - v) * k);
      }
    }
    return LAB_STOPS[LAB_STOPS.length - 1][1];
  }

  // Each slider contributes its bar color, weighted by distance from center.
  // The middle of a bar is neutral (weight 0); the ends are full strength.
  function blend(values) {
    let wSum = 0, wSq = 0, L = 0, a = 0, b = 0, chroma = 0;
    for (const v of values) {
      const w = Math.abs(v * 2 - 1);
      if (!w) continue;
      const [cl, ca, cb] = colorAt(v);
      L += cl * w; a += ca * w; b += cb * w;
      chroma += Math.hypot(ca, cb) * w;
      wSum += w; wSq += w * w;
    }
    if (!wSum) return { strength: 0 };
    L /= wSum; a /= wSum; b /= wSum; chroma /= wSum;
    // Averaging opposing hues drains color toward gray; restore the mean vividness.
    const c = Math.hypot(a, b);
    if (c > 1e-4) { a *= chroma * CHROMA_BOOST / c; b *= chroma * CHROMA_BOOST / c; }
    return {
      rgb: oklabToRgb([L, a, b]).join(','),
      strength: Math.sqrt(wSq / values.length),   // RMS: one strong slider still shows clearly
    };
  }

  // ---------- Sliders ----------
  const sliders = [...document.querySelectorAll('.scales input[type=range]')];
  const mirror = document.getElementById('mirror');
  const fogLayer = document.getElementById('fog');
  const shine = document.getElementById('shine');
  const meter = document.getElementById('meter');
  const meterFill = document.getElementById('meterFill');
  let fog = 0, blur = 0;

  function describe(el) {
    const v = +el.value;
    if (v === 50) return `${v}, balanced`;
    return `${v}, leaning ${v < 50 ? el.dataset.lo : el.dataset.hi}`;
  }

  // Aura: the blended color glows around the mirror; the photo itself stays untouched.
  // Fog follows the average score: heavy at the red end, light at neutral, gone
  // from mid-green up. A slight blur lingers past that, tied to the lowest slider,
  // so the mirror is only perfectly sharp once every slider is all the way right.
  function update() {
    const values = sliders.map(s => s.value / 100);
    const { rgb, strength } = blend(values);
    const k = strength ** 0.6;
    mirror.style.boxShadow = rgb
      ? `0 0 ${18 + 30 * k}px ${3 + 10 * k}px rgba(${rgb},${(.8 * k).toFixed(3)}),` +
        `0 0 ${80 + 90 * k}px ${20 + 50 * k}px rgba(${rgb},${(.3 * k).toFixed(3)})`
      : '';

    const avg = values.reduce((a, b) => a + b, 0) / values.length;
    fog = Math.max(0, (CLEAR_AT - avg) / CLEAR_AT) ** FOG_CURVE;
    const lowest = Math.min(...values);
    const linger = LINGER_BLUR * Math.min(1, (1 - lowest) / 0.1) ** 0.5;   // fades over the last 10%
    blur = Math.max(fog * MAX_BLUR, linger);
    fogLayer.style.opacity = (fog * MAX_FOG).toFixed(3);
    shine.style.opacity = (Math.max(0, (avg - CLEAR_AT) / (1 - CLEAR_AT)) * .8).toFixed(3);
    applyPhotoFilter();

    // Influence rises with the average score
    const pct = Math.round(avg * 100);
    meterFill.style.setProperty('--level', avg.toFixed(3));
    meter.setAttribute('aria-valuenow', pct);
    meter.setAttribute('aria-valuetext', `Influence ${pct} percent`);

    sliders.forEach(s => s.setAttribute('aria-valuetext', describe(s)));
  }
  sliders.forEach(s => s.addEventListener('input', update));
  document.getElementById('reset').addEventListener('click', () => {
    sliders.forEach(s => { s.value = 50; });
    update();
  });

  // ---------- Photo: load, then drag / pinch / scroll to frame ----------
  const photo = document.getElementById('photo');
  const fileInput = document.getElementById('file');
  const photoTools = document.getElementById('photoTools');
  const view = { w: 0, h: 0, zoom: 1, x: 0, y: 0, scale: 1 };
  let objectUrl = null;

  // The blur is applied before the photo's scale transform, so divide it out
  // to keep the on-screen blur the same at any photo size or zoom.
  function applyPhotoFilter() {
    photo.style.filter = blur
      ? `blur(${(blur / view.scale).toFixed(2)}px) saturate(${(1 - .35 * fog).toFixed(3)})`
      : '';
  }

  const hasPhoto = () => mirror.classList.contains('has-photo');
  const openPicker = () => fileInput.click();

  mirror.addEventListener('click', () => { if (!hasPhoto()) openPicker(); });
  mirror.addEventListener('keydown', e => {
    if (!hasPhoto() && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openPicker(); }
  });
  document.getElementById('changePhoto').addEventListener('click', openPicker);

  fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    fileInput.value = '';
    if (!file) return;
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      if (objectUrl) URL.revokeObjectURL(objectUrl);
      objectUrl = url;
      Object.assign(view, { w: img.naturalWidth, h: img.naturalHeight, zoom: 1, x: 0, y: 0 });
      photo.src = url;
      photo.style.width = view.w + 'px';
      photo.style.height = view.h + 'px';
      mirror.classList.add('has-photo');
      mirror.removeAttribute('role');
      mirror.setAttribute('aria-label', 'Your photo in the mirror');
      photoTools.hidden = false;
      render();
    };
    img.onerror = () => {
      URL.revokeObjectURL(url);
      alert("That file couldn't be opened as an image. Try a JPG or PNG.");
    };
    img.src = url;
  });

  function render() {
    if (!view.w) return;
    const { width: fw, height: fh } = mirror.getBoundingClientRect();
    view.zoom = Math.min(4, Math.max(1, view.zoom));
    const scale = Math.max(fw / view.w, fh / view.h) * view.zoom;   // "cover" the frame, then zoom
    const maxX = Math.max(0, (view.w * scale - fw) / 2);
    const maxY = Math.max(0, (view.h * scale - fh) / 2);
    view.x = Math.min(maxX, Math.max(-maxX, view.x));
    view.y = Math.min(maxY, Math.max(-maxY, view.y));
    photo.style.transform = `translate(-50%, -50%) translate(${view.x}px, ${view.y}px) scale(${scale})`;
    if (scale !== view.scale) { view.scale = scale; applyPhotoFilter(); }
  }
  window.addEventListener('resize', render);
  update();

  const pointers = new Map();
  let pinch = null;

  mirror.addEventListener('pointerdown', e => {
    if (!hasPhoto()) return;
    mirror.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    mirror.classList.add('dragging');
    if (pointers.size === 2) pinch = pinchState();
  });

  mirror.addEventListener('pointermove', e => {
    const prev = pointers.get(e.pointerId);
    if (!prev) return;
    const next = { x: e.clientX, y: e.clientY };
    if (pointers.size === 1) {
      view.x += next.x - prev.x;
      view.y += next.y - prev.y;
      pointers.set(e.pointerId, next);
    } else if (pointers.size === 2 && pinch) {
      pointers.set(e.pointerId, next);
      const now = pinchState();
      view.zoom *= now.dist / pinch.dist;
      view.x += now.mx - pinch.mx;
      view.y += now.my - pinch.my;
      pinch = now;
    }
    render();
  });

  const endPointer = e => {
    pointers.delete(e.pointerId);
    pinch = pointers.size === 2 ? pinchState() : null;
    if (!pointers.size) mirror.classList.remove('dragging');
  };
  mirror.addEventListener('pointerup', endPointer);
  mirror.addEventListener('pointercancel', endPointer);

  function pinchState() {
    const [a, b] = [...pointers.values()];
    return { dist: Math.hypot(a.x - b.x, a.y - b.y) || 1, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 };
  }

  mirror.addEventListener('wheel', e => {
    if (!hasPhoto()) return;
    e.preventDefault();
    view.zoom *= Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0015));
    render();
  }, { passive: false });
})();
</script>
</body>
</html>
