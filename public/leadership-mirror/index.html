<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex, nofollow">
<title>Leadership Mirror</title>
<link rel="stylesheet" href="/shared/mirror.css">
<link rel="stylesheet" href="/shared/tools.css">
</head>
<body>
<main>
  <h1>What is it like to be on the other side of me?</h1>

  <div class="stage" data-mirror data-meter-label="Influence"></div>

  <section class="scales with-center" aria-label="Self-assessment">
    <div class="scale">
      <span class="lo">Reactive</span>
      <input type="range" min="0" max="100" value="50" data-lo="Reactive" data-hi="Proactive" data-mid="Attentive" aria-label="Reactive to Proactive">
      <span class="hi">Proactive</span>
    </div>
    <div class="scale">
      <span class="lo">Accidental</span>
      <input type="range" min="0" max="100" value="50" data-lo="Accidental" data-hi="Intentional" data-mid="Habitual" aria-label="Accidental to Intentional">
      <span class="hi">Intentional</span>
    </div>
    <div class="scale">
      <span class="lo">Inconsistent</span>
      <input type="range" min="0" max="100" value="50" data-lo="Inconsistent" data-hi="Consistent" data-mid="Situational" aria-label="Inconsistent to Consistent">
      <span class="hi">Consistent</span>
    </div>
  </section>

  <div class="actions">
    <button class="link" type="button" id="reset">Reset sliders</button>
  </div>

  <p class="privacy"></p>
</main>
<script src="/shared/tools.js"></script>
<script src="/shared/mirror.js"></script>
</body>
</html>
